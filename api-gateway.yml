server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: startup-service
          uri: lb://startup-service
          predicates:
            - Path=/startup/**
        - id: investment-service
          uri: lb://investment-service
          predicates:
            - Path=/investments/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - '*'
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: '*'
            allowCredentials: true

gateway:
  security:
    public-paths:
      - /actuator/**
      - /auth/**
      - /eureka/**
      - /users/public/**
      - /startup/public/**
      - /startup/search
      - /startup/details/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-resources/**
      - /webjars/**
      - /auth/v3/api-docs/**
      - /users/v3/api-docs/**
      - /startup/v3/api-docs/**
      - /investments/v3/api-docs/**
      - /notifications/v3/api-docs/**

rbac:
  default-policy: DENY
  rules: []

jwt:
  secret: ${JWT_SECRET:local-development-secret-change-me}

springdoc:
  swagger-ui:
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: auth-service
        url: /auth/v3/api-docs
      - name: user-service
        url: /users/v3/api-docs
      - name: startup-service
        url: /startup/v3/api-docs
      - name: investment-service
        url: /investments/v3/api-docs
      - name: notification-service
        url: /notifications/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: WARN
    reactor.netty: WARN
    com.founderlink.gateway: INFO
