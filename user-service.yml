server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3307/user_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:founderlink}
    password: ${DB_PASSWORD:founderlink}
  jpa:
    hibernate:
      ddl-auto: update
  cache:
    type: simple        # ← use in-memory cache, disables Redis auto-config
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

internal:
  secret: ${INTERNAL_SECRET:local-internal-secret}

logging:
  level:
    com.founderlink.User_Service: DEBUG   # ← corrected package
